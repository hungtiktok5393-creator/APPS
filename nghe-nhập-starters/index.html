<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện Nghe Tiếng Anh - Starters</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4ECDC4;
            --primary-dark: #3b9b94;
            --secondary: #FF6B6B;
            --accent: #FFE66D;
            --correct: #2ECC71;
            --incorrect: #E74C3C;
            --text-dark: #2C3E50;
            --bg-grad: linear-gradient(135deg, #A8EDEA 0%, #FED6E3 100%);
            --card-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 20px;
            position: relative;
            overflow: hidden;
            border: 4px solid #ffffff;
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Settings Bar */
        .settings-bar {
            background: #F8F9FA;
            padding: 10px 14px;
            border-radius: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
            border: 2px solid #EDF2F7;
        }

        select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid #CBD5E0;
            background: #fff;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            outline: none;
            cursor: pointer;
        }

        .btn-mini {
            padding: 8px 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
            transition: all 0.1s;
        }

        .btn-mini:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        /* Stats Bar */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .stat-card {
            background: #F8F9FA;
            padding: 8px 4px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #EDF2F7;
        }

        .stat-label {
            font-size: 11px;
            color: #718096;
            font-weight: 700;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 900;
            color: var(--text-dark);
        }

        .streak-val { color: #FF9F43; }
        .score-val { color: #10AC84; }
        .high-val { color: #2E86DE; }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 16px;
        }

        .progress-text-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            color: #718096;
            margin-bottom: 4px;
        }

        .progress-box {
            background: #EDF2F7;
            border-radius: 12px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            background: linear-gradient(90deg, #4ECDC4, #2ECC71);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Audio Section */
        .audio-section {
            background: #E0F7FA;
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            margin-bottom: 16px;
            border: 2px dashed #4DD0E1;
        }

        .audio-title {
            font-size: 14px;
            font-weight: 800;
            color: #00838F;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .audio-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-audio {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.1s;
        }

        .btn-normal {
            background: #FF6B6B;
            box-shadow: 0 4px 0 #EE5253;
        }
        .btn-normal:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #EE5253;
        }

        .btn-slow {
            background: #FF9F43;
            box-shadow: 0 4px 0 #EE5253;
        }
        .btn-slow:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #EE5253;
        }

        /* Options Grid */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-option {
            background: #FFFFFF;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 12px 16px;
            text-align: left;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 4px 0 #CBD5E0;
            transition: all 0.15s;
            display: flex;
            align-items: center;
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #CBD5E0;
        }

        .btn-option.correct {
            background: #D4EDDA !important;
            border-color: #28A745 !important;
            color: #155724 !important;
            box-shadow: 0 4px 0 #28A745 !important;
        }

        .btn-option.incorrect {
            background: #F8D7DA !important;
            border-color: #DC3545 !important;
            color: #721C24 !important;
            box-shadow: 0 4px 0 #DC3545 !important;
        }

        /* Result Panel */
        .result-panel {
            display: none;
            background: #FFF9DB;
            border: 2px solid #FFE066;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .transcript-text {
            font-size: 16px;
            font-weight: 900;
            color: #D9480F;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .explanation-text {
            font-size: 13px;
            font-weight: 700;
            color: #5C940D;
            line-height: 1.4;
        }

        /* Action Footer */
        .footer-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }

        .btn-stop {
            background: #EDF2F7;
            color: #4A5568;
            box-shadow: 0 4px 0 #CBD5E0;
            flex: 0.4;
        }

        .btn-next {
            background: #10AC84;
            color: #fff;
            box-shadow: 0 4px 0 #0E8668;
            display: none;
            flex: 1;
        }

        /* End Screen */
        .end-screen {
            display: none;
            text-align: center;
            padding: 10px 0;
        }

        .end-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .report-card {
            background: #F8F9FA;
            border-radius: 20px;
            padding: 16px;
            border: 2px solid #E2E8F0;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 15px;
            color: #4A5568;
            border-bottom: 1px dashed #CBD5E0;
            padding-bottom: 6px;
        }

        .report-item:last-child {
            border-bottom: none;
        }

        .btn-restart {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- MAIN GAME PANEL -->
    <div id="game-panel">
        <!-- Settings Bar -->
        <div class="settings-bar">
            <select id="voice-select"></select>
            <button class="btn-mini" onclick="testVoice()">🔊 Thử</button>
        </div>

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Điểm</div>
                <div class="stat-value score-val" id="score">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🔥 Chuỗi</div>
                <div class="stat-value streak-val" id="streak">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🏆 Kỷ lục</div>
                <div class="stat-value high-val" id="high-score">0</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-text-info">
                <span>Tiến trình hoàn thành:</span>
                <span id="progress-text">0/10 (0%)</span>
            </div>
            <div class="progress-box">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Audio Player -->
        <div class="audio-section">
            <div class="audio-title">🎧 Bấm nút để nghe câu hỏi:</div>
            <div class="audio-controls">
                <button class="btn-audio btn-normal" onclick="speakCurrent(1.0)">▶ Nghe thường</button>
                <button class="btn-audio btn-slow" onclick="speakCurrent(0.55)">🐌 Nghe chậm</button>
            </div>
        </div>

        <!-- Options Grid -->
        <div class="options-grid" id="options-container"></div>

        <!-- Result Box -->
        <div class="result-panel" id="result-panel">
            <div class="transcript-text" id="transcript-text"></div>
            <div class="explanation-text" id="explanation-text"></div>
        </div>

        <!-- Action Buttons -->
        <div class="footer-actions">
            <button class="btn-action btn-stop" onclick="endGame()">Dừng</button>
            <button class="btn-action btn-next" id="btn-next" onclick="nextQuestion()">Câu tiếp theo ➔</button>
        </div>
    </div>

    <!-- END SUMMARY PANEL -->
    <div class="end-screen" id="end-screen">
        <div class="end-title">🎉 KẾT QUẢ CHƠI</div>
        <div class="report-card">
            <div class="report-item"><span>Tổng điểm đạt được:</span> <span id="rep-score" style="color:#10AC84">0</span></div>
            <div class="report-item"><span>Điểm kỷ lục:</span> <span id="rep-high" style="color:#2E86DE">0</span></div>
            <div class="report-item"><span>Số câu đã trả lời:</span> <span id="rep-total">0</span></div>
            <div class="report-item"><span>Tỷ lệ chính xác:</span> <span id="rep-acc" style="color:#FF9F43">0%</span></div>
            <div class="report-item"><span>Chuỗi đúng dài nhất:</span> <span id="rep-maxstreak" style="color:#FF6B6B">0</span></div>
        </div>
        <button class="btn-restart" onclick="restartGame()">🔄 CHƠI LẠI LƯỢT MỚI</button>
    </div>
</div>

<script>
    // --- CHỐNG GIAN LẬN ---
    document.addEventListener('contextmenu', e => e.preventDefault());

    // --- CƠ SỞ DỮ LIỆU CÂU HỎI (BẠN CÓ THỂ THÊM/SỬA Ở ĐÂY) ---
    const RAW_QUESTIONS = [
  {
    id: 1,
    text: "This is a foot.",
    correct: "Đây là một bàn chân.",
    options: [
      "Đây là những bàn chân.",
      "Đây là một bàn chân.",
      "Đó không phải là một bàn chân.",
      "Có một bàn chân ở đây."
    ],
    explain: "Cấu trúc 'This is + danh từ số ít' dùng để chỉ một vật/bộ phận ở gần."
  },
  {
    id: 2,
    text: "These are pianos.",
    correct: "Đây là những chiếc đàn piano.",
    options: [
      "Đây là một chiếc đàn piano.",
      "Đó là những chiếc đàn piano.",
      "Đây là những chiếc đàn piano.",
      "Không có chiếc đàn piano nào ở đây."
    ],
    explain: "Cấu trúc 'These are + danh từ số nhiều' dùng để chỉ nhiều vật ở gần."
  },
  {
    id: 3,
    text: "This is a train.",
    correct: "Đây là một đoàn tàu.",
    options: [
      "Đây là những đoàn tàu.",
      "Đó là một đoàn tàu.",
      "Đây không phải là một đoàn tàu.",
      "Đây là một đoàn tàu."
    ],
    explain: "Cấu trúc 'This is a + danh từ số ít' giới thiệu một vật số ít ở gần."
  },
  {
    id: 4,
    text: "These are sausages.",
    correct: "Đây là những cây xúc xích.",
    options: [
      "Đây là những cây xúc xích.",
      "Đây là một cây xúc xích.",
      "Đó là những cây xúc xích.",
      "Đây đã là những cây xúc xích."
    ],
    explain: "Cấu trúc 'These are + danh từ số nhiều' chỉ nhiều đồ vật ở vị trí gần."
  },
  {
    id: 5,
    text: "This is a lamp.",
    correct: "Đây là một cái đèn.",

      "Đây là những cái đèn.",
      "Đây là một cái đèn.",
      "Kia là một cái đèn.",
      "Đây sẽ là một cái đèn."
    ],
    explain: "Đại từ chỉ định 'This is' đi với danh từ số ít 'a lamp' để chỉ vật ở gần."
  },
  {
    id: 6,
    text: "This is a watch.",
    correct: "Đây là một chiếc đồng hồ đeo tay.",
    options: [
      "Đây là những chiếc đồng hồ đeo tay.",
      "Đó là một chiếc đồng hồ đeo tay.",
      "Đây là một chiếc đồng hồ đeo tay.",
      "Đây không phải là chiếc đồng hồ đeo tay."
    ],
    explain: "Dùng 'This is' cho danh từ đếm được số ít ở vị trí gần."
  },
  {
    id: 7,
    text: "A young child is waving.",
    correct: "Một đứa trẻ nhỏ đang vẫy tay.",
    options: [
      "Một đứa trẻ nhỏ đã vẫy tay.",
      "Một đứa trẻ nhỏ đang vẫy tay.",
      "Những đứa trẻ nhỏ đang vẫy tay.",
      "Một đứa trẻ nhỏ sẽ vẫy tay."
    ],
    explain: "Thì Hiện tại tiếp diễn (is + V-ing) diễn tả hành động đang diễn ra tại thời điểm nói."
  },
  {
    id: 8,
    text: "The woman's bag is in her hand.",
    correct: "Cái túi của người phụ nữ đang ở trong tay cô ấy.",
    options: [
      "Cái túi của người phụ nữ đang ở trên tay cô ấy.",

      "Những cái túi của người phụ nữ đang ở trong tay cô ấy."

    explain: "Sử dụng sở hữu cách ('s), giới từ chỉ vị trí 'in' (trong) và tính từ sở hữu 'her'."

  {

      "Hai người đã mặc quần đùi màu đỏ.",

  {
    id: 10,
    text: "The door of the house is closed.",

  {
    id: 11,
    text: "The dog has brown ears.",

    options: [
      "Con chó đang có đôi tai màu nâu.",
      "Những con chó có đôi tai màu nâu.",
      "Con chó đã có đôi tai màu nâu.",
      "Con chó có đôi tai màu nâu."
    ],
    explain: "Động từ 'has' (thì Hiện tại đơn) diễn tả đặc điểm sở hữu của chủ ngữ số ít."

  {
    id: 12,
    text: "The girl in a blue jacket is talking.",

    options: [
      "Cô gái mặc áo khoác màu xanh dương đang nói chuyện.",
      "Cô gái mặc áo khoác màu xanh dương đã nói chuyện.",

    ],
    explain: "Cụm giới từ bổ nghĩa cho danh từ ('The girl in...') kết hợp thì Hiện tại tiếp diễn ('is talking')."
  },
  {
    id: 13,
    text: "The man with black hair is driving.",
    correct: "Người đàn ông có mái tóc đen đang lái xe.",
    options: [
      "Người đàn ông có mái tóc đen đã lái xe.",
      "Người đàn ông có mái tóc đen đang lái xe.",
      "Người đàn ông có mái tóc đen muốn lái xe.",
      "Những người đàn ông có mái tóc đen đang lái xe."
    ],
    explain: "Giới từ 'with' miêu tả đặc điểm ngoại hình, kết hợp thì Hiện tại tiếp diễn 'is driving'."
  },
  {
    id: 14,
    text: "Chairs have four legs.",
    correct: "Ghế tựa có bốn cái chân.",
    options: [
      "Những cái ghế tựa đang có bốn cái chân.",
      "Một cái ghế tựa có bốn cái chân.",
      "Ghế tựa có bốn cái chân.",
      "Ghế tựa đã có bốn cái chân."
    ],
    explain: "Thì Hiện tại đơn tả sự thật khách quan với danh từ số nhiều 'Chairs' và động từ nguyên mẫu 'have'."
  },
  {
    id: 15,
    text: "In Mark's flat there are chairs next to the table in the kitchen.",
    correct: "Trong căn hộ của Mark có những chiếc ghế ở bên cạnh cái bàn trong nhà bếp.",
    options: [

      "Trong căn hộ của Mark có những chiếc ghế ở trên cái bàn trong nhà bếp.",

      "Trong căn hộ của Mark đã có những chiếc ghế ở bên cạnh cái bàn trong nhà bếp."
    ],
    explain: "Cấu trúc 'There are + N số nhiều' kết hợp các giới từ chỉ vị trí 'next to' (bên cạnh) và 'in' (trong)."

    // --- BIẾN QUẢN LÝ TRẠNG THÁI ---
    let questionDatabase = [];
    let reviewQueue = []; // Danh sách các câu làm sai: [{ question, dueAfter: index }]
    let currentQuestion = null;
    let questionsAnsweredCount = 0; // Đếm tổng số lượt đã bấm trả lời
    
    let score = 0;
    let streak = 0;
    let maxStreak = 0;
    let totalAnswered = 0;
    let correctAnswersCount = 0;
    let highScore = parseInt(localStorage.getItem('starters_high_score') || '0');

    // --- AUDIO FX ---
    const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (AudioCtx.state === 'suspended') AudioCtx.resume();
        const osc = AudioCtx.createOscillator();
        const gain = AudioCtx.createGain();
        osc.connect(gain);
        gain.connect(AudioCtx.destination);
        const now = AudioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.15);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
        } else if (type === 'streak') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(880, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // --- CANVAS PHÁO HOA ---
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
        particles = [];
        const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#2ECC71', '#9B59B6'];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.7) * 12,
                color: colors[Math.floor(Math.random() * colors.length)],
                radius: Math.random() * 4 + 3,
                life: 100
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life -= 2;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fill();

            if (p.life <= 0) particles.splice(index, 1);
        });
        if (particles.length > 0) requestAnimationFrame(animateConfetti);
    }

    // --- WEB SPEECH API ---
    const synth = window.speechSynthesis;
    let selectedVoice = null;

    function populateVoices() {
        const voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
        const voiceSelect = document.getElementById('voice-select');
        voiceSelect.innerHTML = '';

        if(voices.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = "Giọng Mặc Định (English)";
            voiceSelect.appendChild(opt);
            return;
        }

        voices.forEach((v, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${v.name} (${v.lang})`;
            if(v.default || v.lang === 'en-US') opt.selected = true;
            voiceSelect.appendChild(opt);
        });
        selectedVoice = voices[voiceSelect.value] || voices[0];
    }

    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
    }

    document.getElementById('voice-select').addEventListener('change', (e) => {
        const voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
        selectedVoice = voices[e.target.value];
    });

    function speakText(text, rate = 1.0) {
        if (synth.speaking) synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        if (selectedVoice) utter.voice = selectedVoice;
        utter.rate = rate;
        synth.speak(utter);
    }

    function testVoice() {
        speakText("Hello! This is a test voice.", 1.0);
    }

    function speakCurrent(rate) {
        if (currentQuestion) speakText(currentQuestion.text, rate);
    }

    // --- LOGIC GAME & SPACED REPETITION ---
    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initGame() {
        score = 0;
        streak = 0;
        maxStreak = 0;
        totalAnswered = 0;
        correctAnswersCount = 0;
        questionsAnsweredCount = 0;
        
        questionDatabase = RAW_QUESTIONS.map(q => ({ ...q, solved: false }));
        reviewQueue = [];
        
        document.getElementById('high-score').textContent = highScore;
        updateUIStats();
        
        document.getElementById('game-panel').style.display = 'block';
        document.getElementById('end-screen').style.display = 'none';

        nextQuestion();
    }

    function nextQuestion() {
        document.getElementById('result-panel').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';

        // 1. Kiểm tra xem có câu sai nào đã "đủ điều kiện" xuất hiện lại (đã qua ít nhất 3 câu khác)
        const readyReviewIndex = reviewQueue.findIndex(item => questionsAnsweredCount >= item.dueAfter);

        // 2. Lấy danh sách các câu chưa từng trả lời đúng
        let unsolvedQuestions = questionDatabase.filter(q => !q.solved);

        // Nếu tất cả câu đã làm đúng ít nhất 1 lần & không còn câu sai chờ review -> Reset tiến trình
        if (unsolvedQuestions.length === 0 && reviewQueue.length === 0) {
            triggerConfetti();
            questionDatabase.forEach(q => q.solved = false);
            unsolvedQuestions = [...questionDatabase];
        }

        // Chọn câu hỏi tiếp theo dựa trên điều kiện
        if (readyReviewIndex !== -1) {
            // Lấy câu sai đã đủ điều kiện giãn cách
            const reviewItem = reviewQueue.splice(readyReviewIndex, 1)[0];
            currentQuestion = reviewItem.question;
        } else if (unsolvedQuestions.length > 0) {
            // Lấy câu chưa hoàn thành
            const randomIndex = Math.floor(Math.random() * unsolvedQuestions.length);
            currentQuestion = unsolvedQuestions[randomIndex];
        } else {
            // Trường hợp chờ cho đủ 3 câu giãn cách, tạm thời chọn câu ngẫu nhiên trong DB
            const randomIndex = Math.floor(Math.random() * questionDatabase.length);
            currentQuestion = questionDatabase[randomIndex];
        }

        // Render Các Lựa Chọn (Xáo trộn)
        const shuffledOptions = shuffle(currentQuestion.options);
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const labels = ['A', 'B', 'C', 'D'];
        shuffledOptions.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = `<span style="width:24px; color:#A0AEC0;">${labels[i]}.</span> ${optText}`;
            btn.onclick = () => handleAnswer(btn, optText);
            container.appendChild(btn);
        });

        setTimeout(() => speakCurrent(1.0), 300);
    }

    function handleAnswer(selectedBtn, selectedText) {
        const allBtns = document.querySelectorAll('.btn-option');
        allBtns.forEach(btn => btn.disabled = true);

        totalAnswered++;
        questionsAnsweredCount++; // Tăng biến đếm tổng số câu đã làm để tính khoảng cách
        
        const isCorrect = (selectedText === currentQuestion.correct);

        if (isCorrect) {
            correctAnswersCount++;
            selectedBtn.classList.add('correct');
            streak++;
            if (streak > maxStreak) maxStreak = streak;

            // Đánh dấu câu hỏi này đã trả lời ĐÚNG
            const dbItem = questionDatabase.find(q => q.id === currentQuestion.id);
            if (dbItem) dbItem.solved = true;

            // Xóa câu này khỏi reviewQueue nếu có
            reviewQueue = reviewQueue.filter(item => item.question.id !== currentQuestion.id);

            let addedScore = 10;
            if (streak >= 3) addedScore += 2; 
            score += addedScore;

            if (streak >= 3) {
                playSound('streak');
            } else {
                playSound('correct');
            }

            if (streak % 5 === 0 || score >= highScore + 20) {
                triggerConfetti();
            }

        } else {
            selectedBtn.classList.add('incorrect');
            streak = 0; 
            score = Math.max(0, score - 2); 
            playSound('wrong');

            allBtns.forEach(btn => {
                if (btn.textContent.includes(currentQuestion.correct)) {
                    btn.classList.add('correct');
                }
            });

            // Đưa câu SAI vào Review Queue và ĐẶT LỊCH chỉ quay lại sau ít nhất 3 câu nữa
            if (!reviewQueue.some(item => item.question.id === currentQuestion.id)) {
                reviewQueue.push({
                    question: currentQuestion,
                    dueAfter: questionsAnsweredCount + 3 // Bắt buộc làm thêm ít nhất 3 câu khác
                });
            }
        }

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('starters_high_score', highScore);
        }

        updateUIStats();

        // Hiển thị Transcript & Giải thích
        document.getElementById('transcript-text').innerHTML = `🔊 ${currentQuestion.text}`;
        document.getElementById('explanation-text').innerHTML = currentQuestion.explain;
        document.getElementById('result-panel').style.display = 'block';

        document.getElementById('btn-next').style.display = 'block';
    }

    function updateUIStats() {
        document.getElementById('score').textContent = score;
        document.getElementById('streak').textContent = streak;
        document.getElementById('high-score').textContent = highScore;

        // Cập nhật Thanh Tiến Trình & Text %
        const solvedCount = questionDatabase.filter(q => q.solved).length;
        const totalCount = RAW_QUESTIONS.length;
        const progressPercent = Math.round((solvedCount / totalCount) * 100);

        document.getElementById('progress-fill').style.width = `${progressPercent}%`;
        document.getElementById('progress-text').textContent = `${solvedCount}/${totalCount} (${progressPercent}%)`;
    }

    function endGame() {
        document.getElementById('game-panel').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';

        const acc = totalAnswered > 0 ? Math.round((correctAnswersCount / totalAnswered) * 100) : 0;

        document.getElementById('rep-score').textContent = score;
        document.getElementById('rep-high').textContent = highScore;
        document.getElementById('rep-total').textContent = totalAnswered;
        document.getElementById('rep-acc').textContent = `${acc}%`;
        document.getElementById('rep-maxstreak').textContent = `🔥 x${maxStreak}`;
    }

    function restartGame() {
        initGame();
    }

    window.onload = initGame;
</script>
</body>
