<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện Nghe Tiếng Anh Starters</title>
    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Anti-cheat: Chống bôi đen */
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #2c3e50;
            overflow-x: hidden;
        }

        /* Canvas Pháo hoa */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* --- GAME CONTAINER (Modern Card) --- */
        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        /* --- HEADER & STATS BAR --- */
        .header-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #f0f4f8;
            padding: 10px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #2c3e50;
        }

        .streak-val { color: #e67e22; }
        .score-val { color: #27ae60; }
        .high-val { color: #2980b9; }

        /* --- AUDIO BUTTONS SECTION --- */
        .audio-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }

        .audio-wave-icon {
            font-size: 2.5rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .audio-btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-audio {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-audio-normal {
            background: #4ab8a1;
            color: white;
        }

        .btn-audio-slow {
            background: #f39c12;
            color: white;
        }

        .btn-audio:active {
            transform: scale(0.96);
        }

        /* --- TRANSCRIPT & EXPLANATION BOX --- */
        .explanation-box {
            background: #e8f4f8;
            border-left: 5px solid #3498db;
            padding: 12px 16px;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .explanation-box.hidden {
            visibility: hidden;
            opacity: 0;
        }

        .transcript-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .grammar-text {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.3;
        }

        /* --- ANSWERS GRID --- */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .btn-answer {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
        }

        .btn-answer:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-answer.correct {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }

        .btn-answer.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .btn-answer:disabled {
            cursor: pointer; /* Cho phép click để chuyển câu */
        }

        /* --- NEXT QUESTION PROMPT & CONTROLS --- */
        .next-prompt {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: #2563eb;
            background: #dbeafe;
            padding: 10px;
            border-radius: 12px;
            animation: pulse-border 1.5s infinite;
            cursor: pointer;
        }

        @keyframes pulse-border {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .control-panel {
            margin-top: 5px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* --- SUMMARY SCREEN --- */
        .summary-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
        }

        .summary-stats {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 6px;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .btn-restart {
            background: #10b981;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .new-record-badge {
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 8px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        /* Utility */
        .hide { display: none !important; }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="game-card" id="gameScreen">
        <!-- Stats Header -->
        <div class="header-bar">
            <div class="stat-item">
                <span class="stat-label">Điểm</span>
                <span class="stat-value score-val" id="scoreText">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Streak</span>
                <span class="stat-value streak-val" id="streakText">🔥 0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Kỷ lục</span>
                <span class="stat-value high-val" id="highScoreText">0</span>
            </div>
        </div>

        <!-- Audio Section -->
        <div class="audio-section">
            <div class="audio-wave-icon">🎧</div>
            <div class="audio-btn-group">
                <button class="btn-audio btn-audio-normal" id="btnPlayNormal">
                    🔊 Nghe thường
                </button>
                <button class="btn-audio btn-audio-slow" id="btnPlaySlow">
                    🐌 Nghe chậm
                </button>
            </div>
        </div>

        <!-- Explanation & Transcript Area -->
        <div class="explanation-box hidden" id="explanationBox">
            <div class="transcript-text" id="transcriptText">---</div>
            <div class="grammar-text" id="grammarText">---</div>
        </div>

        <!-- Answers Grid -->
        <div class="answers-grid" id="answersGrid">
            <button class="btn-answer">A. Đáp án 1</button>
            <button class="btn-answer">B. Đáp án 2</button>
            <button class="btn-answer">C. Đáp án 3</button>
            <button class="btn-answer">D. Đáp án 4</button>
        </div>

        <!-- Next Question Tap Prompt (Hidden by default) -->
        <div class="next-prompt hide" id="nextPrompt">
            👉 Bấm bất kỳ đâu để sang câu tiếp theo
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <button class="btn-stop" id="btnStop">Dừng chơi / Tổng kết</button>
        </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div class="game-card hide" id="summaryScreen">
        <div class="summary-card">
            <div id="newRecordContainer"></div>
            <div class="summary-title">🎉 KẾT QUẢ PHIÊN CHƠI</div>
            
            <div class="summary-stats">
                <div class="summary-row">
                    <span>Tổng điểm:</span>
                    <span id="sumScore" style="color: #27ae60;">0</span>
                </div>
                <div class="summary-row">
                    <span>Kỷ lục cao nhất:</span>
                    <span id="sumHighScore" style="color: #2980b9;">0</span>
                </div>
                <div class="summary-row">
                    <span>Số câu đã làm:</span>
                    <span id="sumTotal">0</span>
                </div>
                <div class="summary-row">
                    <span>Tỷ lệ chính xác:</span>
                    <span id="sumAccuracy">0%</span>
                </div>
                <div class="summary-row">
                    <span>Streak dài nhất:</span>
                    <span id="sumMaxStreak" style="color: #e67e22;">🔥 0</span>
                </div>
            </div>

            <button class="btn-restart" id="btnRestart">🎮 CHƠI LƯỢT MỚI</button>
        </div>
    </div>

    <script>
        /* --- 1. DỮ LIỆU CÂU HỎI (10 CÂU STARTERS) --- */
        const QUESTION_DATABASE =
[
  {
    "audio": "He plays football in the afternoon.",
    "options": [
      { "text": "Anh ấy chơi bóng đá ở trong cái buổi chiều.", "correct": true },
      { "text": "Anh ấy đang chơi bóng đá ở trong cái buổi chiều.", "correct": false },
      { "text": "Anh ấy đã chơi bóng đá ở trong cái buổi chiều.", "correct": false },
      { "text": "Anh ấy chơi bóng đá ở trên cái buổi chiều.", "correct": false }
    ],
    "grammar": "Thì Hiện tại đơn 'plays' chỉ thói quen; 'in the afternoon' có 'the' nên dịch là 'cái buổi chiều'."
  },
  {
    "audio": "The bus is red.",
    "options": [
      { "text": "Cái xe buýt thì có màu đỏ.", "correct": true },
      { "text": "Xe buýt thì có màu đỏ.", "correct": false },
      { "text": "Cái xe buýt lúc đó thì có màu đỏ.", "correct": false },
      { "text": "Những cái xe buýt thì có màu đỏ.", "correct": false }
    ],
    "grammar": "'The bus' có mạo từ 'the' bắt buộc dịch là 'cái xe buýt'; To Be 'is' dịch là 'thì'."
  },
  {
    "audio": "She is eating a cake.",
    "options": [
      { "text": "Cô ấy thì đang ăn một chiếc bánh ngọt.", "correct": true },
      { "text": "Cô ấy thì đang ăn một cái chiếc bánh ngọt.", "correct": false },
      { "text": "Cô ấy thì ăn một chiếc bánh ngọt.", "correct": false },
      { "text": "Cô ấy đã ăn một chiếc bánh ngọt.", "correct": false }
    ],
    "grammar": "'is eating' là thì Hiện tại tiếp diễn ('thì đang ăn'); 'a cake' không có 'the' nên không có từ 'cái'."
  },
  {
    "audio": "This is the camera.",
    "options": [
      { "text": "Cái này thì là cái chiếc máy ảnh.", "correct": true },
      { "text": "Cái kìa thì là cái chiếc máy ảnh.", "correct": false },
      { "text": "Cái này thì là chiếc máy ảnh.", "correct": false },
      { "text": "Những cái này thì là cái chiếc máy ảnh.", "correct": false }
    ],
    "grammar": "'this' là 'cái này'; 'the camera' có 'the' nên dịch 'cái chiếc máy ảnh'."
  },
  {
    "audio": "An alien is drawing a picture.",
    "options": [
      { "text": "Một người ngoài hành tinh thì đang vẽ một bức tranh.", "correct": true },
      { "text": "Một cái người ngoài hành tinh thì đang vẽ một bức tranh.", "correct": false },
      { "text": "Một người ngoài hành tinh thì vẽ một bức tranh.", "correct": false },
      { "text": "Một người ngoài hành tinh đã vẽ một bức tranh.", "correct": false }
    ],
    "grammar": "'An alien' không có 'the' nên không dịch 'cái'; 'is drawing' là Hiện tại tiếp diễn."
  },
  {
    "audio": "I like candy.",
    "options": [
      { "text": "Tôi thích kẹo.", "correct": true },
      { "text": "Tôi đang thích kẹo.", "correct": false },
      { "text": "Tôi đã thích kẹo.", "correct": false },
      { "text": "Cái tôi thích kẹo.", "correct": false }
    ],
    "grammar": "Thì Hiện tại đơn với 'like' hỏi/nói về sở thích chung."
  },
  {
    "audio": "The children know the alphabet.",
    "options": [
      { "text": "Những đứa trẻ biết cái bảng chữ cái.", "correct": true },
      { "text": "Những đứa trẻ đang biết cái bảng chữ cái.", "correct": false },
      { "text": "Đứa trẻ biết cái bảng chữ cái.", "correct": false },
      { "text": "Những đứa trẻ biết bảng chữ cái.", "correct": false }
    ],
    "grammar": "'children' là danh từ số nhiều bất quy tắc ('những đứa trẻ'); 'the alphabet' dịch là 'cái bảng chữ cái'."
  },
  {
    "audio": "That is an animal.",
    "options": [
      { "text": "Cái kìa thì là một con động vật.", "correct": true },
      { "text": "Cái này thì là một con động vật.", "correct": false },
      { "text": "Cái kìa đã là một con động vật.", "correct": false },
      { "text": "Những cái kìa thì là một con động vật.", "correct": false }
    ],
    "grammar": "'that' là đại từ chỉ định 'cái kìa'; 'is' dịch là 'thì là'."
  },
  {
    "audio": "There are two cars.",
    "options": [
      { "text": "Có hai những chiếc ô tô.", "correct": true },
      { "text": "Có hai chiếc ô tô.", "correct": false },
      { "text": "Có hai những cái chiếc ô tô.", "correct": false },
      { "text": "Lúc đó đã có hai những chiếc ô tô.", "correct": false }
    ],
    "grammar": "'There are' đi với danh từ số nhiều; 'cars' đếm được số nhiều có từ 'những'."
  },
  {
    "audio": "The rabbit is eating carrots.",
    "options": [
      { "text": "Cái con thỏ thì đang ăn những củ cà rốt.", "correct": true },
      { "text": "Con thỏ thì đang ăn những củ cà rốt.", "correct": false },
      { "text": "Cái con thỏ thì ăn những củ cà rốt.", "correct": false },
      { "text": "Cái con thỏ thì đang ăn củ cà rốt.", "correct": false }
    ],
    "grammar": "'The rabbit' có 'the' dịch 'cái con thỏ'; 'carrots' số nhiều dịch 'những củ cà rốt'."
  },
  {
    "audio": "What is the answer?",
    "options": [
      { "text": "Cái câu trả lời thì là cái gì?", "correct": true },
      { "text": "Câu trả lời thì là cái gì?", "correct": false },
      { "text": "Cái câu trả lời lúc đó thì là cái gì?", "correct": false },
      { "text": "Những cái câu trả lời thì là cái gì?", "correct": false }
    ],
    "grammar": "'What is...' hỏi thông tin; 'the answer' có 'the' nên dịch 'cái câu trả lời'."
  },
  {
    "audio": "Is it a cat?",
    "options": [
      { "text": "Nó thì là một con mèo phải không?", "correct": true },
      { "text": "Nó thì là một cái con mèo phải không?", "correct": false },
      { "text": "Nó đã là một con mèo phải không?", "correct": false },
      { "text": "Nó thì đang là một con mèo phải không?", "correct": false }
    ],
    "grammar": "Câu hỏi Yes/No 'Is it a...?' ở thì Hiện tại đơn; 'a cat' không dịch từ 'cái'."
  },
  {
    "audio": "They live in the apartment.",
    "options": [
      { "text": "Họ sống ở trong cái căn hộ.", "correct": true },
      { "text": "Họ đang sống ở trong cái căn hộ.", "correct": false },
      { "text": "Họ đã sống ở trong cái căn hộ.", "correct": false },
      { "text": "Họ sống ở trên cái căn hộ.", "correct": false }
    ],
    "grammar": "Thì Hiện tại đơn 'live' chỉ nơi ở cố định; 'the apartment' dịch là 'cái căn hộ'."
  },
  {
    "audio": "The chicken can run.",
    "options": [
      { "text": "Cái con gà có thể chạy.", "correct": true },
      { "text": "Con gà có thể chạy.", "correct": false },
      { "text": "Cái con gà đã có thể chạy.", "correct": false },
      { "text": "Cái con gà thì đang chạy.", "correct": false }
    ],
    "grammar": "'can + V' chỉ khả năng ở hiện tại; 'the chicken' dịch 'cái con gà'."
  },
  {
    "audio": "How many apples are there?",
    "options": [
      { "text": "Có bao nhiêu những quả táo?", "correct": true },
      { "text": "Có bao nhiêu quả táo?", "correct": false },
      { "text": "Có bao nhiêu những cái quả táo?", "correct": false },
      { "text": "Lúc đó đã có bao nhiêu những quả táo?", "correct": false }
    ],
    "grammar": "'How many' hỏi số lượng danh từ số nhiều ('những quả táo')."
  },
  {
    "audio": "Where is the child?",
    "options": [
      { "text": "Cái đứa trẻ thì ở đâu?", "correct": true },
      { "text": "Đứa trẻ thì ở đâu?", "correct": false },
      { "text": "Những cái đứa trẻ thì ở đâu?", "correct": false },
      { "text": "Cái đứa trẻ lúc đó thì ở đâu?", "correct": false }
    ],
    "grammar": "'Where is' hỏi vị trí danh từ số ít; 'the child' dịch 'cái đứa trẻ'."
  },
  {
    "audio": "These are my arms.",
    "options": [
      { "text": "Những cái này thì là những cánh tay của tôi.", "correct": true },
      { "text": "Cái này thì là những cánh tay của tôi.", "correct": false },
      { "text": "Những cái kìa thì là những cánh tay của tôi.", "correct": false },
      { "text": "Những cái này đã là những cánh tay của tôi.", "correct": false }
    ],
    "grammar": "'these' là 'những cái này'; 'arms' là danh từ số nhiều."
  },
  {
    "audio": "The chips are hot.",
    "options": [
      { "text": "Những cái khoai tây chiên thì nóng.", "correct": true },
      { "text": "Những khoai tây chiên thì nóng.", "correct": false },
      { "text": "Cái khoai tây chiên thì nóng.", "correct": false },
      { "text": "Những cái khoai tây chiên đã nóng.", "correct": false }
    ],
    "grammar": "'the' (cái) + 'chips' (những khoai tây chiên) -> 'những cái khoai tây chiên'."
  },
  {
    "audio": "The cat is under the armchair.",
    "options": [
      { "text": "Cái con mèo thì ở dưới cái ghế bành.", "correct": true },
      { "text": "Con mèo thì ở dưới cái ghế bành.", "correct": false },
      { "text": "Cái con mèo thì ở trên cái ghế bành.", "correct": false },

        /* --- 2. SOUND EFFECTS (Web Audio API) --- */
        class SoundFX {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }

            playCorrect() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }

            playWrong() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(110, now + 0.15);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playStreak() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                [400, 600, 800, 1200].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            }
        }
        const sfx = new SoundFX();

        /* --- 3. FIREWORKS CANVAS ANIMATION --- */
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerFireworks() {
            sfx.playStreak();
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    radius: Math.random() * 4 + 2,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015
                });
            }
        }

        function updateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(updateFireworks);
        }
        updateFireworks();

        /* --- 4. GAME ENGINE & STATE MANAGEMENT --- */
        let mainPool = [];
        let reviewQueue = [];
        let currentQuestion = null;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let totalAnswered = 0;
        let totalCorrect = 0;
        let highScore = parseInt(localStorage.getItem('starters_highscore') || '0');
        
        // Trạng thái chờ học sinh bấm để sang câu mới
        let isWaitingForNext = false;

        // UI Elements
        const elScore = document.getElementById('scoreText');
        const elStreak = document.getElementById('streakText');
        const elHighScore = document.getElementById('highScoreText');
        const elExplanationBox = document.getElementById('explanationBox');
        const elTranscript = document.getElementById('transcriptText');
        const elGrammar = document.getElementById('grammarText');
        const elAnswersGrid = document.getElementById('answersGrid');
        const elNextPrompt = document.getElementById('nextPrompt');

        elHighScore.innerText = highScore;

        function shuffleArray(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            score = 0;
            streak = 0;
            maxStreak = 0;
            totalAnswered = 0;
            totalCorrect = 0;
            isWaitingForNext = false;

            mainPool = shuffleArray([...QUESTION_DATABASE]);
            reviewQueue = [];

            updateStatsDisplay();
            document.getElementById('summaryScreen').classList.add('hide');
            document.getElementById('gameScreen').classList.remove('hide');

            nextQuestion();
        }

        function updateStatsDisplay() {
            elScore.innerText = score;
            elStreak.innerText = `🔥 ${streak}`;
            elHighScore.innerText = highScore;
        }

        /* --- 5. SPEECH SYNTHESIS (TTS) --- */
        function speakAudio(text, rate = 1.0) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = rate;

                const voices = window.speechSynthesis.getVoices();
                const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural')));
                if (enVoice) utterance.voice = enVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        /* --- 6. QUESTION FLOW --- */
        function nextQuestion() {
            isWaitingForNext = false;
            elExplanationBox.classList.add('hidden');
            elNextPrompt.classList.add('hide');

            // Decrement delays in review queue
            reviewQueue.forEach(rq => rq.delay--);

            // Check if any review item is ready
            const readyReviewIdx = reviewQueue.findIndex(rq => rq.delay <= 0);

            if (readyReviewIdx !== -1) {
                currentQuestion = reviewQueue.splice(readyReviewIdx, 1)[0].item;
            } else if (mainPool.length > 0) {
                currentQuestion = mainPool.pop();
            } else {
                mainPool = shuffleArray([...QUESTION_DATABASE]);
                currentQuestion = mainPool.pop();
            }

            renderQuestion(currentQuestion);

            setTimeout(() => {
                speakAudio(currentQuestion.audio, 1.0);
            }, 300);
        }

        function renderQuestion(q) {
            const shuffledOptions = shuffleArray([...q.options]);
            elAnswersGrid.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-answer';
                btn.innerHTML = `<strong>${labels[idx]}.</strong>&nbsp; ${opt.text}`;
                btn.onclick = (e) => {
                    e.stopPropagation(); // Ngăn sự kiện click lan ra ngoài body
                    handleAnswerSelect(opt, btn);
                };
                elAnswersGrid.appendChild(btn);
            });
        }

        function handleAnswerSelect(selectedOpt, btnElement) {
            if (isWaitingForNext) return;

            totalAnswered++;
            
            // Show Transcript and Grammar
            elTranscript.innerText = `🔤 "${currentQuestion.audio}"`;
            elGrammar.innerText = `💡 ${currentQuestion.grammar}`;
            elExplanationBox.classList.remove('hidden');

            // Disable all option buttons
            const allBtns = elAnswersGrid.querySelectorAll('.btn-answer');
            allBtns.forEach(b => b.disabled = true);

            if (selectedOpt.correct) {
                // RIGHT ANSWER
                totalCorrect++;
                btnElement.classList.add('correct');
                streak++;
                if (streak > maxStreak) maxStreak = streak;

                let pointsGained = 10;
                if (streak >= 3) {
                    pointsGained += (streak * 2);
                }
                score += pointsGained;

                sfx.playCorrect();

                if (streak % 5 === 0 || score >= highScore + 50) {
                    triggerFireworks();
                }

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('starters_highscore', highScore.toString());
                }

                updateStatsDisplay();

            } else {
                // WRONG ANSWER
                btnElement.classList.add('wrong');
                sfx.playWrong();

                currentQuestion.options.forEach((opt) => {
                    if (opt.correct) {
                        allBtns.forEach(b => {
                            if (b.innerText.includes(opt.text)) {
                                b.classList.add('correct');
                            }
                        });
                    }
                });

                streak = 0;
                updateStatsDisplay();

                reviewQueue.push({
                    item: currentQuestion,
                    delay: Math.floor(Math.random() * 2) + 2
                });
            }

            // Kích hoạt trạng thái chờ học sinh bấm để qua câu mới
            // Sử dụng setTimeout ngắn để tránh ăn nhầm cú click vừa bấm chọn đáp án
            setTimeout(() => {
                isWaitingForNext = true;
                elNextPrompt.classList.remove('hide');
            }, 200);
        }

        /* --- 7. BẤM BẤT KỲ ĐÂU ĐỂ QUA CÂU --- */
        document.addEventListener('click', (e) => {
            // Nếu đang trong trạng thái chờ và không bấm vào nút "Dừng chơi"
            if (isWaitingForNext && !e.target.closest('#btnStop') && !e.target.closest('.btn-audio')) {
                nextQuestion();
            }
        });

        /* --- 8. SUMMARY & RENDER --- */
        function stopGameAndShowSummary() {
            window.speechSynthesis.cancel();
            isWaitingForNext = false;
            document.getElementById('gameScreen').classList.add('hide');
            document.getElementById('summaryScreen').classList.remove('hide');

            const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;

            document.getElementById('sumScore').innerText = score;
            document.getElementById('sumHighScore').innerText = highScore;
            document.getElementById('sumTotal').innerText = totalAnswered;
            document.getElementById('sumAccuracy').innerText = `${accuracy}%`;
            document.getElementById('sumMaxStreak').innerText = `🔥 ${maxStreak}`;

            const recordContainer = document.getElementById('newRecordContainer');
            if (score > 0 && score >= highScore) {
                recordContainer.innerHTML = `<div class="new-record-badge">👑 PHÁ KỶ LỤC MỚI!</div>`;
                triggerFireworks();
            } else {
                recordContainer.innerHTML = '';
            }
        }

        /* --- 9. EVENT LISTENERS --- */
        document.getElementById('btnPlayNormal').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentQuestion) speakAudio(currentQuestion.audio, 1.0);
        });

        document.getElementById('btnPlaySlow').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentQuestion) speakAudio(currentQuestion.audio, 0.5);
        });

        document.getElementById('btnStop').addEventListener('click', (e) => {
            e.stopPropagation();
            stopGameAndShowSummary();
        });

        document.getElementById('btnRestart').addEventListener('click', (e) => {
            e.stopPropagation();
            initGame();
        });

        // Anti-cheat: Disable right click menu
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Preload speech synthesis voices
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // START GAME
        initGame();
    </script>
</body>
</html>
